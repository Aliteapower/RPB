# Included in nginx http context. Error responses must never become immutable.
map "$status:$uri" $rpb_frontend_cache_control {
    default "";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    ~^[0-9]+:/assets/ "no-store";
    ~^[0-9]+:/index\.html$ "no-store";
    ~^[0-9]+:/frontend-version\.json$ "no-store";
}
